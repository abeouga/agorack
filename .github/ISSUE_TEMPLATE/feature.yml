name: Feature / Task
description: 新機能の実装や通常の開発タスク
title: "[Feature] "
labels:
  - Feature

body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: このIssueで何を実現するのか記載してください。
      placeholder: 例）道具の結果から根拠を取り出し、共通の形にそろえる
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: 実装内容
      description: 実装する内容と、置く場所（apps・packages の中のどこか）を具体的に記載してください。
      placeholder: |
        例）
        - apps/server/src/evidence/ に extract を置く
        - structuredContent の中から kind・source_id・label・location を持つ要素を探す
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: このIssueをCloseできる条件を記載してください。
      placeholder: |
        例）
        - 文之助の MCP が返した結果を保存したもので、根拠が取り出せる
        - 型の検査と静的検査が通る
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 関連する設計・資料
      description: 関連する設計の節や決めごとの記録があれば記載してください。
      placeholder: 例）docs/architecture.md §7

  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: その他必要な情報があれば記載してください。
