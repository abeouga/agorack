name: Improvement
description: 動きを変えずにコードを整理する（リファクタリング・共通化・技術的負債の解消）
title: "[Improvement] "
labels:
  - Improvement

body:
  - type: textarea
    id: target
    attributes:
      label: 整理する対象
      description: どのファイル・処理を、どう整理するのか記載してください。
      placeholder: 例）SSE のイベントの組み立てを http の中から contracts の型を使う1か所にまとめる
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: なぜ整理するか
      description: 整理しないと何が困るのかを記載してください。
      placeholder: 例）同じイベントを2か所で作っており、画面とサーバーで形が食い違うおそれがある
    validations:
      required: true

  - type: textarea
    id: unchanged
    attributes:
      label: 変えないもの
      description: 整理の前後で同じでなければならないもの（画面の表示、SSE のイベント、API の応答など）を記載してください。
      placeholder: |
        例）
        - SSE のイベントの名前と中身
        - 右の欄に出る根拠
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: 同じであることの確かめ方
      description: 整理の前に結果を保存し、後の結果と比べる方法を記載してください。
      placeholder: |
        例）
        1. 直す前に、偽の部品と偽のモデルで流したイベントを保存する
        2. 直した後に同じことをして、全部が同じことを確かめる
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 関連する設計・Issue
      placeholder: 例）docs/architecture.md §4.1
